<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Agentic AI Course — $199 Full Access</title>
    <meta name="description" content="Learn to design, build, and deploy AI agents that do real work. 8 modules, 40 lessons, videos, quizzes, worksheets, and a certificate of completion. $199 one-time, lifetime access." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light;
        --bg: #F7F5F0; --surface: #FFFFFF; --surface2: #EFECE4;
        --text: #0F1A2E; --dim: #5B6472; --border: #E2DED2;
        --accent: #D97706; --accent-text: #92400E; --accent-hover: #B45309;
        --navy: #0F1A2E; --success: #15803D; --success-bg: #DCFCE7;
        --danger: #B91C1C; --danger-bg: #FEE2E2;
        --radius: 14px;
        --font-sans: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
        --font-serif: "IBM Plex Serif", Georgia, serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #0B1220; --surface: #131E33; --surface2: #1B2A45;
          --text: #F1EFE8; --dim: #9AA5B5; --border: #2A3A57;
          --accent: #F59E0B; --accent-text: #FBBF24; --accent-hover: #FBBF24;
          --success-bg: #14532D; --danger-bg: #450A0A;
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body { margin: 0; font-family: var(--font-sans); background: var(--bg); color: var(--text); font-size: 16px; line-height: 1.5; }
      h1, h2, h3 { line-height: 1.25; margin: 0; }
      p { margin: 0; }
      button { font-family: inherit; cursor: pointer; }
      input, textarea { font-family: inherit; font-size: 16px; color: var(--text); }
      a { color: var(--accent-text); }
      .serif { font-family: var(--font-serif); }
      .wrap { max-width: 1152px; margin: 0 auto; padding: 0 16px; }
      .hidden { display: none !important; }

      /* Buttons */
      .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: none; border-radius: 999px; font-weight: 600; font-size: 16px; padding: 13px 26px; min-height: 48px; text-decoration: none; transition: background .15s ease, opacity .15s ease; }
      .btn:disabled { opacity: .5; cursor: not-allowed; }
      .btn-accent { background: var(--accent); color: #fff; }
      .btn-accent:hover:not(:disabled) { background: var(--accent-hover); }
      .btn-navy { background: var(--navy); color: #fff; }
      @media (prefers-color-scheme: dark) { .btn-navy { background: var(--accent); color: #0B1220; } }
      .btn-ghost { background: var(--surface); border: 1px solid var(--border); color: var(--text); font-weight: 500; }
      .btn-ghost:hover { background: var(--surface2); }
      .btn-white10 { background: rgba(255,255,255,.1); color: #fff; font-weight: 500; }
      .btn-white10:hover { background: rgba(255,255,255,.2); }
      .btn-sm { padding: 9px 20px; min-height: 44px; font-size: 15px; }

      /* Cards */
      .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
      .card-pad-lg { padding: 24px; }

      /* Header (in-course) */
      .app-header { background: var(--navy); color: #fff; position: sticky; top: 0; z-index: 20; padding-top: env(safe-area-inset-top); }
      .app-header .row { display: flex; align-items: center; gap: 12px; padding-top: 12px; padding-bottom: 4px; }
      .app-header .title { font-weight: 600; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .app-header .student { font-size: 12px; color: rgba(255,255,255,.7); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .app-header .right { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
      .pct-pill { font-size: 12px; background: rgba(255,255,255,.1); border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
      .link-btn { background: none; border: none; color: rgba(255,255,255,.85); font-size: 12px; text-decoration: underline; padding: 8px 4px; min-height: 40px; }
      .app-nav { display: flex; gap: 8px; padding-top: 8px; padding-bottom: 12px; overflow-x: auto; scrollbar-width: none; }
      .app-nav::-webkit-scrollbar { display: none; }
      .nav-btn { white-space: nowrap; border: none; border-radius: 999px; padding: 9px 16px; font-size: 14px; font-weight: 500; min-height: 40px; background: rgba(255,255,255,.1); color: #fff; }
      .nav-btn:hover { background: rgba(255,255,255,.2); }
      .nav-btn.active { background: var(--accent); color: #fff; }

      main { padding: 24px 0 64px; }

      /* Navy hero panels */
      .navy-panel { background: var(--navy); color: #fff; border-radius: var(--radius); padding: 24px; }
      @media (min-width: 640px) { .navy-panel { padding: 28px; } }
      .progress-track { height: 12px; border-radius: 999px; background: rgba(255,255,255,.2); overflow: hidden; }
      .progress-fill { height: 100%; background: var(--accent); border-radius: 999px; transition: width .4s ease; }

      /* Module number badge */
      .mod-badge { flex-shrink: 0; width: 36px; height: 36px; border-radius: 999px; display: grid; place-items: center; font-weight: 600; font-size: 14px; background: var(--accent); color: #fff; }
      .mod-badge.done { background: var(--success); }
      .mod-badge.locked { background: var(--surface2); color: var(--dim); }

      .muted { color: var(--dim); }
      .small { font-size: 14px; }
      .xs { font-size: 12px; }
      .stack > * + * { margin-top: 12px; }
      .stack-lg > * + * { margin-top: 24px; }

      /* Lesson list rows */
      .lesson-list { list-style: none; margin: 12px 0 0; padding: 0; }
      .lesson-list li + li { border-top: 1px solid var(--border); }
      .lesson-row { width: 100%; text-align: left; background: none; border: none; padding: 11px 0; display: flex; align-items: center; gap: 12px; min-height: 44px; font-size: 16px; color: var(--text); }
      button.lesson-row:hover { background: var(--surface2); }
      .lesson-row.static { color: var(--dim); cursor: default; }
      .lesson-row .flex1 { flex: 1; min-width: 0; }
      .done-mark { color: var(--success); }
      .todo-mark { color: var(--dim); }

      /* Lesson reading */
      .lesson-article { max-width: 768px; margin: 0 auto; }
      .lesson-article .intro { font-size: 18px; color: var(--dim); line-height: 1.65; margin-top: 12px; }
      .lesson-article section { margin-top: 32px; }
      .lesson-article section h3 { font-size: 20px; font-weight: 600; }
      .lesson-article section p { margin-top: 12px; line-height: 1.75; font-size: 17px; }
      .lesson-article ul { margin: 12px 0 0; padding-left: 20px; line-height: 1.6; }
      .lesson-article ul li + li { margin-top: 6px; }
      .example-box { margin-top: 16px; background: var(--surface2); border-left: 4px solid var(--accent); border-radius: 0 var(--radius) var(--radius) 0; padding: 16px; line-height: 1.65; }
      .takeaways { margin-top: 40px; }
      .worksheet { margin-top: 40px; border: 2px solid color-mix(in srgb, var(--accent) 50%, transparent); }
      .field label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; }
      .field textarea, .field input[type="text"], .text-input {
        width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 11px 14px;
        background: var(--surface); color: var(--text); min-height: 48px;
      }
      .field textarea { line-height: 1.55; resize: vertical; }
      .field + .field { margin-top: 16px; }
      .saved-msg { color: var(--success); font-size: 14px; margin-top: 12px; }
      .err-msg { color: var(--danger); font-size: 14px; margin-top: 8px; }
      .complete-chip { display: inline-flex; align-items: center; gap: 8px; background: var(--success-bg); color: var(--success); font-weight: 600; border-radius: 999px; padding: 10px 16px; }

      /* Video player */
      .video-figure { margin: 24px 0 0; background: var(--navy); color: #fff; border-radius: var(--radius); overflow: hidden; }
      .video-box { position: relative; aspect-ratio: 16 / 9; background: #000; }
      .video-box video { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
      .video-play-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.25); border: none; width: 100%; padding: 0; }
      .video-play-btn { display: flex; width: 64px; height: 64px; align-items: center; justify-content: center; border-radius: 999px; background: var(--accent); color: #fff; box-shadow: 0 10px 25px rgba(0,0,0,.35); }
      .video-caption { padding: 12px 16px; background: rgba(0,0,0,.2); display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; }
      .video-caption .vt { font-size: 14px; font-weight: 500; color: #fff; }
      .video-caption .vs { font-size: 12px; color: rgba(255,255,255,.6); }

      /* Quiz */
      .quiz-q { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin: 0; }
      .quiz-q legend { font-weight: 500; padding: 0 4px; font-size: 16px; }
      .quiz-opts { margin-top: 12px; display: grid; gap: 8px; }
      .quiz-opt { display: flex; align-items: flex-start; gap: 12px; border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; cursor: pointer; min-height: 48px; line-height: 1.45; }
      .quiz-opt:hover { background: var(--surface2); }
      .quiz-opt.sel { border-color: var(--accent); background: var(--surface2); }
      .quiz-opt input { margin-top: 3px; width: 16px; height: 16px; flex-shrink: 0; accent-color: var(--accent); }
      .quiz-result { border-radius: var(--radius); padding: 24px; text-align: center; }
      .quiz-result.pass { background: var(--success-bg); }
      .quiz-result.fail { background: var(--danger-bg); }
      .quiz-result .score { font-size: 48px; font-weight: 700; line-height: 1; }

      /* Certificates */
      .cert-grid { display: grid; gap: 12px; }
      @media (min-width: 640px) { .cert-grid { grid-template-columns: 1fr 1fr; } }
      #certificate-print {
        background: #FFFFFF; color: #0F1A2E; border: 4px double #D97706; border-radius: var(--radius);
        box-shadow: 0 10px 30px rgba(15,26,46,.18); padding: 32px; text-align: center;
      }
      @media (min-width: 640px) { #certificate-print { padding: 48px; } }
      #certificate-print .cert-kicker { letter-spacing: .3em; font-size: 12px; font-weight: 600; color: #92400E; }
      #certificate-print .cert-course { font-family: var(--font-serif); font-size: 30px; margin-top: 24px; }
      #certificate-print .cert-sub { font-size: 14px; color: #5B6472; margin-top: 4px; }
      #certificate-print .cert-name { font-family: var(--font-serif); font-size: 40px; line-height: 1.2; margin-top: 8px; border-bottom: 1px solid #E2DED2; padding-bottom: 16px; }
      @media (min-width: 640px) { #certificate-print .cert-name { font-size: 48px; } }
      #certificate-print .cert-body { margin-top: 20px; line-height: 1.65; max-width: 576px; margin-left: auto; margin-right: auto; }
      #certificate-print .cert-meta { margin-top: 40px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 24px; text-align: left; font-size: 14px; max-width: 576px; margin-left: auto; margin-right: auto; }
      #certificate-print .cert-meta .k { color: #5B6472; }
      #certificate-print .cert-meta .v { font-weight: 600; margin-top: 2px; }
      #certificate-print .cert-meta .v.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      #certificate-print .cert-seal { margin: 40px auto 0; width: 56px; height: 56px; border-radius: 999px; background: #0F1A2E; color: #fff; display: grid; place-items: center; font-size: 20px; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

      /* Enroll page */
      .hero { background: var(--navy); color: #fff; padding-top: env(safe-area-inset-top); }
      .hero-inner { padding: 40px 0 48px; }
      @media (min-width: 640px) { .hero-inner { padding: 56px 0; } }
      .hero .kicker { color: var(--accent); font-weight: 600; font-size: 14px; letter-spacing: .04em; }
      @media (prefers-color-scheme: dark) { .hero .kicker { color: #FBBF24; } }
      .hero h1 { font-family: var(--font-serif); font-size: 36px; margin-top: 12px; line-height: 1.15; }
      @media (min-width: 640px) { .hero h1 { font-size: 48px; } }
      .hero .lede { margin-top: 16px; font-size: 18px; color: rgba(255,255,255,.85); max-width: 672px; line-height: 1.6; }
      .price-row { margin-top: 24px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
      .price-row .price { font-size: 36px; font-weight: 700; }
      .price-row .terms { color: rgba(255,255,255,.85); }
      .pay-row { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 12px; }
      .pay-col { margin-top: 24px; display: grid; gap: 12px; max-width: 440px; }
      .btn-paypal { background: #0079C1; color: #fff; }
      .btn-paypal:hover { background: #005EA6; }
      .hero-code { margin-top: 20px; max-width: 440px; }
      .hero-code .err-msg { color: #FCA5A5; }
      .pay-note { margin-top: 10px; font-size: 12px; color: rgba(255,255,255,.6); max-width: 560px; line-height: 1.6; }

      .enroll-grid { display: grid; gap: 32px; padding: 32px 0 64px; }
      @media (min-width: 1024px) { .enroll-grid { grid-template-columns: 1fr 380px; } }
      .enroll-side { height: fit-content; }
      @media (min-width: 1024px) { .enroll-side { position: sticky; top: 24px; } }
      .include-list { margin: 8px 0 0; padding-left: 20px; font-size: 15px; line-height: 1.6; }
      .include-list li + li { margin-top: 6px; }
      .module-lessons { list-style: none; margin: 8px 0 0; padding: 0; font-size: 14px; }
      .module-lessons li { color: var(--dim); padding: 1px 0; }
      .module-lessons .lbl { color: var(--text); font-weight: 500; }

      .req-list { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 12px; }
      .req-list li { display: flex; gap: 12px; align-items: flex-start; line-height: 1.55; }
      .loading { min-height: 60vh; display: grid; place-items: center; color: var(--dim); }

      @media print {
        body * { visibility: hidden; }
        #certificate-print, #certificate-print * { visibility: visible; }
        #certificate-print { position: absolute; inset: 0; margin: 0; box-shadow: none !important; }
        .no-print { display: none !important; }
      }
      @media (prefers-reduced-motion: reduce) {
        .progress-fill { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="app"><div class="loading"><p>Loading the course…</p></div></div>
    <noscript><p style="padding:24px">This course needs JavaScript enabled to run.</p></noscript>
    <script>
    "use strict";
    /* ================= Agentic AI Course — public edition =================
       Static build: all course content ships with the page; each student's
       name, progress, worksheets, quiz scores and certificates live in that
       student's own browser storage and are restored on return visits. */

    var STRIPE_URL = "https://buy.stripe.com/8x214m63VcCX8Ci7VI67S00";
    var PAYPAL_BUSINESS = "tagomar691@gmail.com";
    var PAYPAL_ITEM_NAME = "Agentic AI Course — Full Access (Lifetime)";
    /* The shared access code itself never appears in this page — only its
       SHA-256 fingerprint does. Unlocking hashes what the visitor types
       (trimmed, uppercased) with crypto.subtle and compares fingerprints;
       a match sets S.unlocked, which persists in browser storage. */
    var ACCESS_CODE_SHA256 = "cd09be456634db2ee8e3d3b19040a67b5614b8f0bfe8d36808ce2b506166da28";
    var CODE_NOTE = "Paying by card? Stripe shows your access code on its confirmation page after checkout. Paying with PayPal? Your access code will be emailed to you by ForAllHR after payment.";
    var HERO_NOTE = "Secure checkout on Stripe or PayPal. Your access code unlocks the full course in your browser the moment you have it.";
    var PAID_RETURN = /[?&]paid=paypal(?:&|$)/.test(window.location.search || "");

    function pageUrl() { return window.location.href.split(/[?#]/)[0]; }
    function paypalUrl() {
      var base = pageUrl();
      return "https://www.paypal.com/cgi-bin/webscr?cmd=_xclick" +
        "&business=" + encodeURIComponent(PAYPAL_BUSINESS) +
        "&item_name=" + encodeURIComponent(PAYPAL_ITEM_NAME) +
        "&amount=199.00&currency_code=USD&no_shipping=1" +
        "&return=" + encodeURIComponent(base + "?paid=paypal") +
        "&cancel_return=" + encodeURIComponent(base);
    }
    function enrollCtaHtml(paypalLabel) {
      return '<a class="btn btn-accent" href="' + STRIPE_URL + '" target="_blank" rel="noopener">Pay with Card — Stripe</a>' +
        '<a class="btn btn-paypal" href="' + paypalUrl() + '" target="_blank" rel="noopener">' + (paypalLabel || "Pay with PayPal") + "</a>";
    }
    function codeFormHtml(idp, onDark) {
      return '<form data-code-form="' + idp + '" novalidate>' +
        '<label for="code-' + idp + '" class="small" style="font-weight:500;display:block">I already paid — enter access code</label>' +
        '<input id="code-' + idp + '" class="text-input code-input" type="text" placeholder="Access code" autocomplete="off" autocapitalize="characters" spellcheck="false" style="margin-top:8px" />' +
        '<p class="err-msg hidden" data-code-err role="alert"></p>' +
        '<button type="submit" class="btn ' + (onDark ? "btn-white10" : "btn-navy") + '" style="margin-top:12px;width:100%">Unlock the course</button></form>';
    }
    function paidPanelHtml(idp) {
      return '<div class="card" style="border:2px solid var(--success)">' +
        '<h2 style="font-size:20px;font-weight:600">Thanks for enrolling with PayPal!</h2>' +
        '<p class="small" style="margin-top:6px;line-height:1.65">Your access code will be emailed to you by ForAllHR — check the inbox of the email address on your PayPal account (and the spam folder, just in case). When it arrives, enter it here to unlock the full course in this browser:</p>' +
        '<div style="margin-top:16px">' + codeFormHtml(idp) + "</div></div>";
    }
    function sha256Hex(text) {
      var data = new TextEncoder().encode(text);
      return window.crypto.subtle.digest("SHA-256", data).then(function (buf) {
        var bytes = new Uint8Array(buf);
        var hex = "";
        for (var i = 0; i < bytes.length; i++) hex += ("0" + bytes[i].toString(16)).slice(-2);
        return hex;
      });
    }
    function wireCodeForms(scope) {
      if (!scope) return;
      var forms = scope.querySelectorAll("[data-code-form]");
      for (var i = 0; i < forms.length; i++) {
        forms[i].addEventListener("submit", function (e) {
          e.preventDefault();
          var form = this;
          var input = form.querySelector(".code-input");
          var err = form.querySelector("[data-code-err]");
          var code = (input.value || "").trim().toUpperCase();
          var fail = function () {
            err.textContent = "That code doesn't match. Check the code from your checkout and try again.";
            err.classList.remove("hidden");
          };
          err.classList.add("hidden");
          if (!code || !window.crypto || !window.crypto.subtle) { fail(); return; }
          sha256Hex(code).then(function (hex) {
            if (hex === ACCESS_CODE_SHA256) {
              S.unlocked = true;
              persist();
              render();
              window.scrollTo({ top: 0 });
            } else fail();
          }, fail);
        });
      }
    }
    var LS_KEY = "agentic-ai-course-public-v1";
    var TOTAL_UNITS = 48; // 40 lessons + 8 module quizzes
    var CAPSTONE_FIELDS = ["nameJob", "instructions", "tools", "memoryPlan", "guardrails", "launchPlan"];

    /* Video for every lesson that has one: all five Module 1 lessons and the
       opening lesson of Modules 2–8 (same clips as the private app). */
    var LESSON_VIDEOS = {
      "1.1": { src: "assets/asset-01.mp4", poster: "assets/asset-01.jpg" },
      "1.2": { src: "assets/asset-02.mp4", poster: "assets/asset-02.jpg" },
      "1.3": { src: "assets/asset-03.mp4", poster: "assets/asset-03.jpg" },
      "1.4": { src: "assets/asset-04.mp4", poster: "assets/asset-04.jpg" },
      "1.5": { src: "assets/asset-05.mp4", poster: "assets/asset-05.jpg" },
      "2.1": { src: "assets/asset-06.mp4", poster: "assets/asset-06.jpg" },
      "3.1": { src: "assets/asset-07.mp4", poster: "assets/asset-07.jpg" },
      "4.1": { src: "assets/asset-08.mp4", poster: "assets/asset-08.jpg" },
      "5.1": { src: "assets/asset-09.mp4", poster: "assets/asset-09.jpg" },
      "6.1": { src: "assets/asset-10.mp4", poster: "assets/asset-10.jpg" },
      "7.1": { src: "assets/asset-11.mp4", poster: "assets/asset-11.jpg" },
      "8.1": { src: "assets/asset-12.mp4", poster: "assets/asset-12.jpg" }
    };

    var M1_EXERCISE_FIELDS = [
      ["agentName", "1. Name your agent", "e.g. Monday Report Agent", 1],
      ["agentJob", "2. Its job — one or two sentences, with a checkable definition of “done”", "e.g. Every Sunday evening, gather last week's sales numbers and draft my Monday report. Done = a complete draft in my documents, with every figure sourced.", 3],
      ["agentTools", "3. Its tools — list each one and mark it read (R) or write (W)", "e.g. Read spreadsheet (R), read email (R), create document (W)", 3],
      ["agentRules", "4. Its rules & guardrails — what needs your approval? When must it stop and ask?", "e.g. Never send anything without my approval. Stop and ask if a figure is missing or looks wrong.", 3],
      ["firstTask", "5. Its first task — written exactly as you would give it", "e.g. Prepare this week's Monday report draft from the sales sheet and flag anything unusual.", 3]
    ];

    /* ---------- storage (with in-memory fallback if storage is blocked) ---------- */
    var memFallback = null;
    var store = {
      load: function () {
        try { var raw = localStorage.getItem(LS_KEY); if (raw) return JSON.parse(raw); }
        catch (e) { if (memFallback) return memFallback; }
        return null;
      },
      save: function (s) {
        memFallback = s;
        try { localStorage.setItem(LS_KEY, JSON.stringify(s)); } catch (e) { /* in-memory only */ }
      }
    };

    function defaultState() {
      return {
        unlocked: false,
        name: "",
        completedLessons: [],
        quizzes: {},          // module -> { best, attempts, passed }
        exercise: { agentName: "", agentJob: "", agentTools: "", agentRules: "", firstTask: "" },
        moduleExercises: {},  // module -> { fieldKey: value }
        certificates: {}      // scope ("M1".."M8","FINAL") -> { code, issuedAt }
      };
    }
    var S = store.load() || defaultState();
    // Tolerate older/partial shapes.
    (function () {
      var d = defaultState();
      for (var k in d) if (S[k] === undefined) S[k] = d[k];
    })();
    function persist() { store.save(S); }

    /* ---------- course data (loaded from assets/asset-01.json) ---------- */
    var COURSE = null;
    function lessonsOf(n) { return (COURSE && COURSE.lessonsByModule[String(n)]) || []; }
    function quizOf(n) { return (COURSE && COURSE.quizzes[String(n)]) || []; }
    function moduleTitle(n) { var m = COURSE.modules[n - 1]; return m ? m.title : "Module " + n; }
    function lessonById(id) {
      for (var n = 1; n <= 8; n++) { var l = lessonsOf(n); for (var i = 0; i < l.length; i++) if (l[i].id === id) return l[i]; }
      return null;
    }

    /* ---------- derived module state (mirrors the original app) ---------- */
    function modInfo(n) {
      var ids = lessonsOf(n).map(function (l) { return l.id; });
      var done = ids.filter(function (id) { return S.completedLessons.indexOf(id) >= 0; }).length;
      var q = S.quizzes[String(n)] || { best: 0, attempts: 0, passed: false };
      return {
        module: n,
        paywalled: n > 1 && !S.unlocked,
        unlocked: n === 1 || (S.unlocked && ((S.quizzes[String(n - 1)] || {}).passed === true)),
        lessonsDone: done,
        allLessonsDone: done === ids.length && ids.length > 0,
        quizBestScore: q.best || 0,
        quizAttempts: q.attempts || 0,
        quizPassed: q.passed === true,
        complete: done === ids.length && ids.length > 0 && q.passed === true
      };
    }
    function allModules() { var a = []; for (var n = 1; n <= 8; n++) a.push(modInfo(n)); return a; }
    function capstoneSaved() {
      var cap = S.moduleExercises["8"] || {};
      return CAPSTONE_FIELDS.every(function (f) { return (cap[f] || "").trim().length > 0; });
    }
    function allModulesComplete() { return allModules().every(function (m) { return m.complete; }); }
    function finalEligible() { return allModulesComplete() && capstoneSaved(); }
    function overallPct() {
      var passed = allModules().filter(function (m) { return m.quizPassed; }).length;
      return Math.round(((S.completedLessons.length + passed) / TOTAL_UNITS) * 100);
    }
    function currentModule() {
      var ms = allModules();
      for (var i = 0; i < ms.length; i++) if (ms[i].unlocked && !ms[i].complete) return ms[i].module;
      return S.unlocked ? 8 : 1;
    }
    function nextStep() {
      var n = currentModule();
      var info = modInfo(n);
      var lessons = lessonsOf(n);
      for (var i = 0; i < lessons.length; i++) {
        if (S.completedLessons.indexOf(lessons[i].id) < 0) {
          return { view: { kind: "lesson", id: lessons[i].id }, label: "Continue: " + lessons[i].number + " — " + lessons[i].title };
        }
      }
      if (!info.quizPassed) return { view: { kind: "quiz", module: n }, label: "Take the Module " + n + " quiz" };
      if (finalEligible() || S.certificates["FINAL"]) return { view: { kind: "certificate", scope: "FINAL" }, label: "View your final certificate" };
      return { view: { kind: "certificates" }, label: "View your certificates" };
    }
    function scopeLabel(scope) {
      if (scope === "FINAL") return "Agentic AI Course — Final Certificate";
      var n = Number(scope.slice(1));
      return "Module " + n + " — " + moduleTitle(n);
    }
    function fmtDate(iso) {
      return new Date(iso).toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });
    }
    function makeCode(prefix) {
      var chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      var s = "";
      for (var i = 0; i < 8; i++) s += chars[Math.floor(Math.random() * chars.length)];
      return "AAI-" + prefix + "-" + s.slice(0, 4) + "-" + s.slice(4);
    }
    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    /* ================= Views ================= */
    var app = document.getElementById("app");
    var view = { kind: "dashboard" };
    var quizSession = null; // { module, answers, result, warn }

    function setView(v) {

        (PAID_RETURN && !S.unlocked ? '<div style="margin-top:24px;max-width:672px">' + paidPanelHtml("paid") + "</div>" : "") +
        (S.unlocked ? "" :
          '<div class="pay-col">' + enrollCtaHtml("Pay with PayPal — $199") + "</div>" +
          '<p class="pay-note">' + HERO_NOTE + " Module 1 is free to preview — all 5 lessons, videos, and the quiz.</p>" +

    /* ---------------- In-course app shell ---------------- */

        persist();
        setView({ kind: "dashboard" });

      var navBtns = app.querySelectorAll("[data-nav]");

      else if (view.kind === "curriculum") renderCurriculum(root);

      else if (view.kind === "quiz") renderQuiz(root, view.module);
      else if (view.kind === "certificates") renderCertificates(root);

    function badgeHtml(info) {
      if (info.complete) return '<span class="mod-badge done">✓</span>';
      if (info.unlocked) return '<span class="mod-badge">' + info.module + "</span>";
      return '<span class="mod-badge locked" aria-hidden="true">🔒</span>';
    }

    /* ---------------- Dashboard ---------------- */
    function renderDashboard(root) {
      var progress = overallPct();

      wireCodeForms(root);
    }

    /* ---------------- Curriculum ---------------- */

      var sections = COURSE.modules.map(function (m) {
        var info = modInfo(m.n);

    function wireNavButtons(root) {

    /* ---------------- Certificates list ---------------- */
    function renderCertificates(root) {
      var scopes = COURSE.modules.map(function (m) { return "M" + m.n; }).concat(["FINAL"]);
      var cards = scopes.map(function (scope) {

    /* ---------------- Lesson video ----------------
       Same download-then-play player as the original app: the clip is
       downloaded once with fetch() and played from a local blob object
       URL — NOT streamed from the asset URL. Phone webviews refuse to
       decode a <video> whose server answers a plain 200 without
       byte-range support or serves a generic content type; an object URL
       is already fully local, and the blob is re-typed video/mp4. If the
       download fails, fall back to the plain asset URL; a genuine decode
       error on both paths swaps in a direct link instead of a dead box.
       Playback starts from a real tap so play() runs inside the gesture. */
    function mountLessonVideo(container, lesson) {
      var media = LESSON_VIDEOS[lesson.id] || LESSON_VIDEOS["1.1"];
      var videoSrc = media.src, posterSrc = media.poster;
      container.innerHTML =
        '<div class="video-box">' +
        '<video poster="' + posterSrc + '" playsinline preload="auto" aria-label="' + esc(lesson.number) + " video: " + esc(lesson.title) + '">' +
        "Your browser does not support embedded video. The full written lesson below covers the same material.</video>" +
        '<button type="button" class="video-play-overlay" aria-label="Play the lesson video: ' + esc(lesson.title) + '">' +
        '<span class="video-play-btn"><svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor" aria-hidden="true" style="margin-left:4px"><path d="M8 5v14l11-7z"/></svg></span>' +
        "</button></div>" +
        '<figcaption class="video-caption"><span class="vt">▶ Lesson video — “' + esc(lesson.title) + '”</span><span class="vs">Watch the video, then read the full lesson below.</span></figcaption>';
      var video = container.querySelector("video");
      var overlay = container.querySelector(".video-play-overlay");
      var caption = container.querySelector(".video-caption");
      var blobUrl = null, useDirect = false, wantPlay = false, started = false, failed = false;

      function currentSrc() { return blobUrl || (useDirect ? videoSrc : null); }
      function tryPlay() {
        var src = currentSrc();
        if (!src) { useDirect = true; wantPlay = true; video.src = videoSrc; video.load(); return; }
        var p = video.play();
        if (p && p.catch) p.catch(function () { wantPlay = true; video.controls = true; overlay.classList.add("hidden"); });
      }
      var timer = window.setTimeout(function () {
        if (!blobUrl && !failed) { useDirect = true; if (!video.src) video.src = videoSrc; if (wantPlay) { video.load(); video.play().catch(function () {}); } }
      }, 6000);
      fetch(videoSrc)
        .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.blob(); })
        .then(function (b) {
          if (b.type.indexOf("text/html") >= 0) throw new Error("asset route returned HTML");
          var typed = b.type === "video/mp4" ? b : new Blob([b], { type: "video/mp4" });
          blobUrl = URL.createObjectURL(typed);
          video.src = blobUrl;
          if (wantPlay && !started) { video.load(); video.play().catch(function () { video.controls = true; }); }
        })
        .catch(function () {
          useDirect = true;
          if (!video.src) video.src = videoSrc;
          if (wantPlay && !started) { video.load(); video.play().catch(function () { video.controls = true; }); }
        })
        .then(function () { window.clearTimeout(timer); }, function () { window.clearTimeout(timer); });

      overlay.addEventListener("click", function () { wantPlay = true; tryPlay(); });
      video.addEventListener("play", function () { started = true; video.controls = true; overlay.classList.add("hidden"); });
      video.addEventListener("error", function () {
        if (!video.src) return;
        failed = true;
        overlay.classList.add("hidden");
        caption.innerHTML = '<span class="vt">The video couldn\'t play in this browser.</span> <a href="' + videoSrc + '" target="_blank" rel="noopener" style="color:#fff;text-decoration:underline;font-size:14px;font-weight:500">Open the video directly</a><span class="vs" style="flex-basis:100%">The full written lesson below covers the same material.</span>';
      });
    }

      if (!info.unlocked) {

          root.innerHTML =
            '<div class="card card-pad-lg" style="max-width:672px;margin:0 auto">' +

            '<div style="margin-top:20px;display:grid;gap:10px;max-width:440px">' + enrollCtaHtml() + "</div>" +
            '<p class="xs muted" style="margin-top:12px">' + CODE_NOTE + "</p>" +
            '<div style="margin-top:16px;max-width:440px">' + codeFormHtml("quiz") + "</div></div>";
          wireCodeForms(root);
          return;
        }
        root.innerHTML =
          '<div class="card card-pad-lg" style="max-width:672px;margin:0 auto">' +
          '<h2 style="font-size:24px;font-weight:600">🔒 Module ' + module + " Quiz is locked</h2>" +
          '<p class="muted" style="margin-top:8px">Pass the Module ' + (module - 1) + " quiz with 80% or higher to unlock Module " + module + ".</p>" +
          '<button type="button" class="btn btn-navy" id="locked-go" style="margin-top:20px">Go to the Module ' + (module - 1) + " quiz</button></div>";
        document.getElementById("locked-go").addEventListener("click", function () { setView({ kind: "quiz", module: module - 1 }); });
        return;
      }
      if (!quizSession || quizSession.module !== module) {
        quizSession = { module: module, answers: quiz.map(function () { return -1; }), result: null, warn: "" };
      }
      if (quizSession.result) { renderQuizResult(root, module, quiz); return; }

      var qsHtml = quiz.map(function (q, i) {
        var opts = q.options.map(function (opt, oi) {
          var sel = quizSession.answers[i] === oi;
          return '<label class="quiz-opt' + (sel ? " sel" : "") + '"><input type="radio" name="' + q.id + '" data-q="' + i + '" data-o="' + oi + '"' + (sel ? " checked" : "") + " /><span>" + esc(opt) + "</span></label>";
        }).join("");
        return '<fieldset class="quiz-q"><legend>' + (i + 1) + ". " + esc(q.question) + '</legend><div class="quiz-opts" role="radiogroup" aria-label="' + esc(q.question) + '">' + opts + "</div></fieldset>";
      }).join("");

      root.innerHTML =
        '<div style="max-width:768px;margin:0 auto">' +

        '<p class="muted" style="margin-top:4px">10 questions drawn from the five lessons of Module ' + module + ". Score 80% or higher to pass" +
        (module < 8 && S.unlocked ? " and unlock Module " + (module + 1) : "") + ". Unlimited retakes — your best score is saved." +
        (info.quizAttempts > 0 ? ' Current best: <strong>' + info.quizBestScore + "%</strong> across " + info.quizAttempts + " attempt" + (info.quizAttempts === 1 ? "" : "s") + "." : "") + "</p>" +
        '<form id="quiz-form" style="margin-top:24px"><div class="stack">' + qsHtml + "</div>" +
        (quizSession.warn ? '<p class="err-msg" role="alert" style="margin-top:16px">' + esc(quizSession.warn) + " Press “Submit quiz” again to submit anyway.</p>" : "") +

          var labels = this.closest(".quiz-opts").querySelectorAll(".quiz-opt");
          for (var x = 0; x < labels.length; x++) labels[x].classList.remove("sel");
          this.closest(".quiz-opt").classList.add("sel");

      document.getElementById("quiz-form").addEventListener("submit", function (e) {
        e.preventDefault();
        var unanswered = quizSession.answers.filter(function (a) { return a === -1; }).length;
        if (unanswered > 0 && !quizSession.warn) {
          quizSession.warn = "You still have " + unanswered + " unanswered question" + (unanswered === 1 ? "" : "s") + " — unanswered questions count as incorrect.";
          render(); // re-render keeps answers (quizSession persists)
          return;
        }
        gradeQuiz(module, quiz);
      });
    }

    function gradeQuiz(module, quiz) {
      var answers = quizSession.answers;
      var correct = 0;
      var review = quiz.map(function (q, i) {
        var sel = answers[i] == null ? -1 : answers[i];
        var ok = sel === q.answer;
        if (ok) correct++;
        return { selected: sel, correctIndex: q.answer, isCorrect: ok };
      });
      var total = quiz.length;
      var pct = Math.round((correct / total) * 100);
      var passed = pct >= 80;
      var rec = S.quizzes[String(module)] || { best: 0, attempts: 0, passed: false };
      rec.attempts = (rec.attempts || 0) + 1;
      rec.best = Math.max(rec.best || 0, pct);
      rec.passed = rec.passed === true || passed;
      S.quizzes[String(module)] = rec;
      persist();
      quizSession.result = { scorePercent: pct, correctCount: correct, totalCount: total, passed: passed, review: review, bestScore: rec.best };
      render();
      window.scrollTo({ top: 0 });
    }

    function renderQuizResult(root, module, quiz) {
      var result = quizSession.result;
      var info = modInfo(module);
      var primaryBtn;
      if (result.passed && info.allLessonsDone) {
        primaryBtn = '<button type="button" class="btn btn-accent" data-res="cert">Get your Module ' + module + " certificate</button>";

        primaryBtn = '<button type="button" class="btn btn-accent" data-res="next">Start Module ' + (module + 1) + "</button>";
      } else if (result.passed && module < 8) {
        primaryBtn = enrollCtaHtml();
      } else {
        primaryBtn = '<button type="button" class="btn btn-ghost" data-res="dash">Back to dashboard</button>';
      }
      var reviewHtml = quiz.map(function (q, i) {
        var r = result.review[i];
        return '<section class="card"><p style="font-weight:500">' + (i + 1) + ". " + esc(q.question) + " " +
          (r.isCorrect ? '<span style="color:var(--success);font-weight:600">✓ Correct</span>' : '<span style="color:var(--danger);font-weight:600">✗ Incorrect</span>') + "</p>" +
          '<p class="small" style="margin-top:8px">Your answer: <span style="font-weight:500">' + (r.selected === -1 ? "(no answer)" : esc(q.options[r.selected])) + "</span></p>" +
          (!r.isCorrect ? '<p class="small" style="margin-top:4px">Correct answer: <span style="font-weight:500">' + esc(q.options[r.correctIndex]) + "</span></p>" : "") +
          '<p class="small muted" style="margin-top:8px">' + esc(q.explanation) + "</p></section>";
      }).join("");

      root.innerHTML =
        '<div style="max-width:768px;margin:0 auto">' +
        '<section class="quiz-result ' + (result.passed ? "pass" : "fail") + '">' +
        '<p class="score">' + result.scorePercent + "%</p>" +
        '<p style="font-weight:600;margin-top:4px">' + (result.passed ? "You passed the Module " + module + " quiz!" : "Not yet — 80% is required to pass.") + "</p>" +
        '<p class="small" style="margin-top:4px">' + result.correctCount + " of " + result.totalCount + " correct · Your best score: " + Math.max(result.bestScore, info.quizBestScore) + "%</p>" +
        (result.passed && module < 8 && S.unlocked ? '<p class="small" style="margin-top:8px;font-weight:500">🔓 Module ' + (module + 1) + " — " + esc(moduleTitle(module + 1)) + " — is now unlocked.</p>"
          : result.passed && module === 1 && !S.unlocked ? '<p class="small" style="margin-top:8px;font-weight:500">🔒 Module 2 — ' + esc(moduleTitle(2)) + " — is part of the full course. Enroll to keep going.</p>" : "") +
        '<div style="margin-top:16px;display:flex;flex-wrap:wrap;justify-content:center;gap:12px">' +
        '<button type="button" class="btn btn-navy" data-res="retake">Retake quiz</button>' + primaryBtn +
        "</div></section>" +
        '<h3 style="font-size:20px;font-weight:600;margin-top:32px">Review your answers</h3>' +
        '<div class="stack" style="margin-top:16px">' + reviewHtml + "</div></div>";

      var btns = root.querySelectorAll("[data-res]");
      for (var i = 0; i < btns.length; i++) {
        btns[i].addEventListener("click", function () {
          var act = this.getAttribute("data-res");
          if (act === "retake") { quizSession = { module: module, answers: quiz.map(function () { return -1; }), result: null, warn: "" }; render(); }
          else if (act === "cert") setView({ kind: "certificate", scope: "M" + module });
          else if (act === "next") setView({ kind: "lesson", id: (module + 1) + ".1" });
          else setView({ kind: "dashboard" });
        });
      }
    }

    /* ---------------- Certificate ---------------- */
    function ensureCertificate(scope) {
      if (S.certificates[scope]) return S.certificates[scope];
      var eligible = scope === "FINAL" ? finalEligible() : modInfo(Number(scope.slice(1))).complete;
      if (!eligible) return null;
      var prefix = scope === "FINAL" ? "COURSE" : scope;
      var cert = { code: makeCode(prefix), issuedAt: new Date().toISOString() };
      S.certificates[scope] = cert;
      persist();
      return cert;
    }

    function renderCertificate(root, scope) {
      var isFinal = scope === "FINAL";
      var module = isFinal ? 0 : Number(scope.slice(1));
      var info = isFinal ? null : modInfo(module);
      var cert = ensureCertificate(scope);
      var eligible = isFinal ? finalEligible() : info.complete;

      if (!eligible && !cert) {
        var reqs;
        if (isFinal) {
          reqs =
            '<li><span>' + (allModulesComplete() ? "✅" : "⬜") + "</span><span><strong>Complete all 8 modules</strong> — " + allModules().filter(function (m) { return m.complete; }).length + " of 8 complete (every module's lessons done and quiz passed).</span></li>" +
            '<li><span>' + (capstoneSaved() ? "✅" : "⬜") + "</span><span><strong>Save the Module 8 capstone worksheet</strong> with all six fields completed (Lesson 8.5).</span></li>";
        } else {
          reqs =
            '<li><span>' + (info.allLessonsDone ? "✅" : "⬜") + "</span><span><strong>Complete all 5 Module " + module + " lessons</strong> — " + info.lessonsDone + " of 5 done.</span></li>" +
            '<li><span>' + (info.quizPassed ? "✅" : "⬜") + "</span><span><strong>Pass the Module " + module + " quiz with 80% or higher</strong>" + (info.quizAttempts ? " — best score so far: " + info.quizBestScore + "%." : " — not attempted yet.") + "</span></li>";
        }
        root.innerHTML =
          '<div class="card card-pad-lg" style="max-width:672px;margin:0 auto">' +
          '<h2 style="font-size:24px;font-weight:600">' + (isFinal ? "Final Certificate — Agentic AI Course" : "Module " + module + " Certificate") + "</h2>" +
          '<p class="muted" style="margin-top:4px">' + (isFinal ? "Your final certificate unlocks when both requirements are met:" : "This certificate unlocks when both requirements are met:") + "</p>" +
          '<ul class="req-list">' + reqs + "</ul>" +
          '<div style="margin-top:24px;display:flex;flex-wrap:wrap;gap:12px">' +
          '<button type="button" class="btn btn-navy" id="cert-go-curriculum">Go to curriculum</button>' +
          (isFinal && !capstoneSaved() && modInfo(8).unlocked ? '<button type="button" class="btn btn-accent" id="cert-go-capstone">Open the capstone</button>' : "") +
          "</div></div>";
        document.getElementById("cert-go-curriculum").addEventListener("click", function () { setView({ kind: "curriculum" }); });
        var cap = document.getElementById("cert-go-capstone");
        if (cap) cap.addEventListener("click", function () { setView({ kind: "lesson", id: "8.5" }); });
        return;
      }
      if (!cert) { root.innerHTML = '<p class="muted" style="text-align:center;padding:40px 0">Issuing your certificate…</p>'; return; }

      var bestScore = isFinal
        ? Math.min.apply(null, allModules().map(function (m) { return m.quizBestScore; }))
        : info.quizBestScore;
      var bodyText = isFinal
        ? "has successfully completed the full Agentic AI Course — all eight modules (40 lessons), every module assessment passed at 80% or higher — and submitted a complete capstone agent design covering instructions, tools, memory, guardrails, evaluation, and a launch plan."
        : "has successfully completed all five lessons of Module " + module + " — " + esc(moduleTitle(module)) + " — and passed the module assessment with a score of " + bestScore + "% (80% required).";

      root.innerHTML =
        '<div style="max-width:768px;margin:0 auto">' +
        '<div class="no-print" style="display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px">' +
        '<button type="button" class="btn btn-ghost" id="cert-all">All certificates</button></div>' +
        '<div id="certificate-print">' +
        '<p class="cert-kicker">CERTIFICATE OF COMPLETION</p>' +
        '<p class="cert-course">Agentic AI Course</p>' +
        '<p class="cert-sub">' + (isFinal ? "Full Course — All 8 Modules" : "Module " + module + " — " + esc(moduleTitle(module))) + "</p>" +
        '<p style="margin-top:32px;color:#5B6472">This certifies that</p>' +
        '<p class="cert-name">' + esc(S.name) + "</p>" +
        '<p class="cert-body">' + bodyText + "</p>" +
        '<div class="cert-meta">' +
        '<div><p class="k">Date of completion</p><p class="v">' + fmtDate(cert.issuedAt) + "</p></div>" +
        '<div><p class="k">Verification code</p><p class="v mono">' + esc(cert.code) + "</p></div>" +
        '<div><p class="k">Credential</p><p class="v">Certificate of completion — not an accredited credential</p></div>' +
        "</div>" +
        '<div class="cert-seal" aria-hidden="true">🎓</div>' +
        "</div>" +
        '<p class="no-print small muted" style="margin-top:16px;text-align:center">Keep your verification code — it uniquely identifies this certificate.</p>' +
        "</div>";

      document.getElementById("cert-all").addEventListener("click", function () { setView({ kind: "certificates" }); });
    }

    /* ---------------- Boot ---------------- */
    fetch("assets/asset-01.json")
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (data) { COURSE = data; render(); })
      .catch(function () {
        app.innerHTML = '<div class="loading"><div style="text-align:center"><p style="color:var(--text);font-weight:500">Could not load the course content.</p><p class="small muted" style="margin-top:6px">Check your connection and reload the page.</p></div></div>';
      });
    </script>
  </body>
</html>
